name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs need the same throwaway database. The name must end in "_test":
# the test suites refuse to truncate anything else.
env:
  TEST_DATABASE_URL: postgresql://pulsewatch:pulsewatch@localhost:5432/pulsewatch_test
  DATABASE_URL: postgresql://pulsewatch:pulsewatch@localhost:5432/pulsewatch_test
  JWT_SECRET: ci-only-secret-long-enough-for-hs256-signing
  CORS_ORIGIN: http://localhost:5173

jobs:
  build:
    name: lint, typecheck, unit + API tests, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsewatch
          POSTGRES_PASSWORD: pulsewatch
          POSTGRES_DB: pulsewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run typecheck

      - name: Unit and API tests, with coverage thresholds
        run: npx vitest run --coverage

      - run: npm run build

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsewatch
          POSTGRES_PASSWORD: pulsewatch
          POSTGRES_DB: pulsewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests against a full local stack
        run: npx playwright test
        env:
          CI: '1'

      - name: Keep traces from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: production images (build + smoke test)
    runs-on: ubuntu-latest
    needs: build
    env:
      JWT_SECRET: ci-only-docker-secret-long-enough-for-hs256
      DEMO_ADMIN_PASSWORD: ci-only-admin-password

    steps:
      - uses: actions/checkout@v5

      - name: Build every image target
        run: |
          docker compose -f docker-compose.prod.yml build
          docker build --target web -t pulsewatch-web .
          docker build -t pulsewatch-all .

      - name: Start the production stack
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Smoke test it the way a visitor would
        run: BASE_URL=http://localhost:4000 ADMIN_PASSWORD="$DEMO_ADMIN_PASSWORD" bash scripts/smoke-test.sh

      - name: Container logs
        if: always()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail=100

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Only a push to main, and only once every other job has passed: a broken
    # build must never reach the live site.
    needs: [build, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger the hosting platform's deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping deploy (see DEPLOY.md)."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy triggered."
