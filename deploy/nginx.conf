# The `web` image (guide section 12, option B): nginx serves the React build
# and forwards /api to the api container, so the browser still sees one origin.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Vite fingerprints everything under /assets: safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    # The API trusts exactly one proxy hop (TRUST_PROXY=1), which is this.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Client-side routes (/incidents/42, /status) all load the same page, which
  # must never be cached, or a deploy would not reach returning visitors.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
